name: Update Contributors
on:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributors and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Fetch contributors with retry (API can return 202 if stats aren't cached)
          for i in 1 2 3; do
            gh api repos/${{ github.repository }}/contributors \
              --jq '[.[] | {login, url: .html_url, id}]' > /tmp/contribs.json 2>/dev/null
            if [ -s /tmp/contribs.json ] && jq -e 'length > 0' /tmp/contribs.json > /dev/null 2>&1; then
              break
            fi
            echo "Contributor stats not ready (attempt $i), retrying in 10s..."
            sleep 10
          done

          # 2. Use Node.js to build the avatar table and update README
          node -e '
          const fs = require("fs");
          const c = JSON.parse(fs.readFileSync("/tmp/contribs.json", "utf8"));

          if (c.length === 0) {
            console.log("No contributors found");
            process.exit(0);
          }

          // Build HTML table, 6 per row
          let table = "<table>\n";
          for (let i = 0; i < c.length; i += 6) {
            table += "<tr>\n";
            for (let j = i; j < i + 6 && j < c.length; j++) {
              table += `<td align="center"><a href="${c[j].url}"><img src="https://avatars.githubusercontent.com/u/${c[j].id}?s=80" width="80" style="border-radius:50%" alt="${c[j].login}"><br><sub><b>${c[j].login}</b></sub></a></td>\n`;
            }
            table += "</tr>\n";
          }
          table += "</table>";

          // Replace the section in README
          const readme = fs.readFileSync("README.md", "utf8");
          const marker = "## Contributors";
          const next = "## Acknowledgments";
          const s = readme.indexOf(marker);
          const e = readme.indexOf(next, s);

          if (s === -1 || e === -1 || e <= s) {
            console.error("Could not find README section markers");
            process.exit(1);
          }

          if (s === -1 || e === -1) {
            console.error("Could not find section markers in README:", { marker, next, s, e });
            process.exit(1);
          }

          const updated = readme.slice(0, s) + marker + "\n\n" + table + "\n\n" + readme.slice(e);
          fs.writeFileSync("README.md", updated);
          console.log("README updated with", c.length, "contributors");
          '

          # 4. Exit early if no changes
          git diff --quiet README.md && echo "No changes" && exit 0

          # 5. Create branch, commit, push, open PR
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B contributors/update
          git add README.md
          git commit -m "docs: update contributors list"
          git push origin contributors/update --force

          gh pr create \
            --base main \
            --head contributors/update \
            --title "docs: update contributors" \
            --body "Automated contributor avatar refresh." \
            --fill 2>&1 || echo "PR create failed — check if PR already exists"
