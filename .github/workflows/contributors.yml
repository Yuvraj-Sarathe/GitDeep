name: Update Contributors

on:
  push:
    branches:
      - main

jobs:
  contributors:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fetch all contributors via gh CLI (handles pagination and 202 retries automatically)
      - name: Fetch contributors from GitHub API
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching contributors for ${{ github.repository }}..."
          gh api "repos/${{ github.repository }}/contributors" --paginate \
            --jq '[.[] | {login, id, avatar_url, html_url, type}]' \
            > /tmp/contributors.json

          COUNT=$(jq '. | length' /tmp/contributors.json)
          echo "Found $COUNT contributors total"

          if [ "$COUNT" -eq 0 ]; then
            echo "No contributors found. Dumping API response for debugging:"
            gh api "repos/${{ github.repository }}/contributors" --paginate --jq '.' || true
          fi

          # Log each contributor so we can see what's happening
          jq -r '.[] | "  - \(.login) (type: \(.type))"' /tmp/contributors.json

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # Generate the avatar HTML table and update README
      - name: Generate contributor table and update README
        id: generate
        run: |
          INPUT="/tmp/contributors.json"
          COUNT=$(jq '. | length' "$INPUT")

          if [ "$COUNT" -eq 0 ]; then
            echo "result=empty" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build HTML table, 6 contributors per row
          TABLE="<table>"
          ROW="<tr>"
          IDX=0

          while [ "$IDX" -lt "$COUNT" ]; do
            LOGIN=$(jq -r ".[$IDX].login" "$INPUT")
            URL=$(jq -r ".[$IDX].html_url" "$INPUT")
            ID=$(jq -r ".[$IDX].id" "$INPUT")

            # Use exactly s=100 (no v=4 from API) for consistent sizing
            CELL="<td align=\"center\"><a href=\"$URL\"><img src=\"https://avatars.githubusercontent.com/u/$ID?v=4&amp;s=100\" width=\"100\" style=\"border-radius:50%\" alt=\"$LOGIN\"/><br /><sub><b>$LOGIN</b></sub></a></td>"
            ROW="$ROW$CELL"

            if [ $(((IDX + 1) % 6)) -eq 0 ] || [ $((IDX + 1)) -eq "$COUNT" ]; then
              TABLE="$TABLE$ROW</tr>"
              ROW="<tr>"
            fi

            IDX=$((IDX + 1))
          done

          TABLE="$TABLE</table>"

          echo "Generated table with $COUNT contributors"

          # Update README: replace content between the two section markers
          MARKER='## 👥 Contributors'
          NEXT='## 🙏 Acknowledgments'

          # Use awk or sed for a clean section replacement
          awk -v marker="$MARKER" -v nextsec="$NEXT" -v table="$TABLE" '
            $0 ~ marker { found=1; print; print ""; print table; print ""; next }
            found && $0 ~ nextsec { found=0 }
            !found
          ' README.md > README.md.tmp && mv README.md.tmp README.md

          # Check if anything actually changed
          if git diff --name-only | grep -q README.md; then
            echo "result=updated" >> "$GITHUB_OUTPUT"
          else
            echo "result=no-change" >> "$GITHUB_OUTPUT"
          fi

      # Push changes to a branch and open a PR (bypasses branch protection on main)
      - name: Create or update pull request
        if: steps.generate.outputs.result == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="contributors/update"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add README.md
          git commit -m "docs(README): update contributors list"
          git push origin "$BRANCH" --force

          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number,url --jq '.[0].url' 2>/dev/null)
          if [ -n "$EXISTING_PR" ]; then
            echo "PR already exists: $EXISTING_PR — branch updated, PR will reflect changes automatically"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs(README): update contributors list" \
              --body "Automated refresh of contributor avatars in the Contributors section."
          fi
